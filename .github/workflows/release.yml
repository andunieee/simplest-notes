name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Import release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          keystore="$RUNNER_TEMP/release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$keystore"
          keytool -list -keystore "$keystore" \
            -alias "$ANDROID_KEY_ALIAS" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" > /dev/null
          echo "ANDROID_KEYSTORE=$keystore" >> "$GITHUB_ENV"

      - name: Derive version from tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ "$version" =~ ^([0-9]+)\.([0-9]+)(\.([0-9]+))?$ ]]; then
            major=$((10#${BASH_REMATCH[1]}))
            minor=$((10#${BASH_REMATCH[2]}))
            patch=$((10#${BASH_REMATCH[4]:-0}))
            echo "ANDROID_VERSION_NAME=$version" >> "$GITHUB_ENV"
            echo "ANDROID_VERSION_CODE=$((major * 10000 + minor * 100 + patch))" >> "$GITHUB_ENV"
          else
            echo "::warning::tag $GITHUB_REF_NAME is not v<major>.<minor>[.<patch>]; using the default version"
          fi

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="simplest-notes-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$asset"
          gh release create "$GITHUB_REF_NAME" "$asset" \
            --title "Simplest Notes $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag

      - uses: actions/setup-go@v5
        if: github.ref_type == 'tag'
        with:
          go-version-file: packaging/zapstore/go.mod
          cache-dependency-path: packaging/zapstore/go.sum

      - name: Publish to Zapstore
        if: github.ref_type == 'tag'
        env:
          SIGN_WITH: ${{ secrets.ZAPSTORE_OWNER_NSEC }}
          GITHUB_TOKEN: ${{ github.token }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "${SIGN_WITH}" ]; then
            echo "::warning::ZAPSTORE_OWNER_NSEC is not set, skipping the Zapstore publish"
            exit 0
          fi
          if [ -z "${ANDROID_KEYSTORE:-}" ]; then
            echo "::warning::the release keystore is not configured, skipping the Zapstore publish"
            exit 0
          fi
          (cd packaging/zapstore && go build -o "${RUNNER_TEMP}/zapstore" .)
          "${RUNNER_TEMP}/zapstore"
